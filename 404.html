<!DOCTYPE html>
<html>
  <head>
    <script>
      // Ce script intercepte l'erreur 404, regarde l'URL, 
      // et redirige vers le bon chemin avec /mes-jeux/ au milieu.
      var path = window.location.pathname;
      if (path.startsWith('/play/')) {
        window.location.href = '/mes-jeux' + path;
      }
    </script>
  </head>
  <body>
    <h1>Redirection en cours...</h1>
  </body>
</html>
